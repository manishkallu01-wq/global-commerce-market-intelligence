resources:
  jobs:
    commerce_pipeline:
      name: commerce-intelligence-${bundle.target}
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze
          spark_python_task: {python_file: ../spark/jobs/bronze_ingest.py}
          job_cluster_key: pipeline_cluster
        - task_key: silver
          depends_on: [{task_key: bronze}]
          spark_python_task: {python_file: ../spark/jobs/silver_products.py}
          job_cluster_key: pipeline_cluster
        - task_key: gold
          depends_on: [{task_key: silver}]
          spark_python_task: {python_file: ../spark/jobs/gold_market_marts.py}
          job_cluster_key: pipeline_cluster
      job_clusters:
        - job_cluster_key: pipeline_cluster
          new_cluster: {spark_version: 15.4.x-scala2.12, node_type_id: i3.xlarge, autoscale: {min_workers: 2, max_workers: 20}, data_security_mode: SINGLE_USER}
