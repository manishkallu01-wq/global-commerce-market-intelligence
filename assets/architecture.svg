<g><rect x="315" y="180" width="180" height="250" rx="18" fill="#e8f3ff"/><text x="405" y="245" font-size="23" font-weight="700" fill="#163b68">AWS ingestion</text><text x="405" y="285" font-size="17" fill="#52667c">S3 manifests</text><text x="405" y="320" font-size="17" fill="#52667c">Kinesis streams</text><text x="405" y="355" font-size="17" fill="#52667c">Glue catalog</text></g>
