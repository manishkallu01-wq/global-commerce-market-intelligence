<rect width="1200" height="520" rx="28" fill="url(#bg)"/><text x="60" y="72" fill="#fff" font-family="Arial" font-size="34" font-weight="700">Petabyte-scale commerce intelligence</text><text x="60" y="108" fill="#a9d5ff" font-family="Arial" font-size="18">Open web signals → governed lakehouse → business decisions</text>
