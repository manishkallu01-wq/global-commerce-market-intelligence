<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Global Commerce Market Intelligence architecture</title><desc id="desc">Common Crawl and GDELT flow through AWS ingestion, Databricks, Redshift, dbt and QuickSight.</desc>
