name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: make all
      - run: python -m compileall -q src scripts spark
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infrastructure fmt -check
      - run: terraform -chdir=infrastructure init -backend=false
      - run: terraform -chdir=infrastructure validate
      - uses: actions/upload-artifact@v4
        with: {name: dashboard-screenshot, path: assets/dashboard-screenshot.png}
